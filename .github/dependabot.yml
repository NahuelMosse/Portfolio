version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Patch and minor updates of an ecosystem arrive in one pull request; each major gets its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # @types/node describes the Node the site runs on (engines: >=24 <25); a newer major would let the type check
    # accept APIs that Node 24 lacks. It moves to a new major only together with engines.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 is the compiler rewritten in Go, and Next.js does not build with it yet (the build failed on the
      # Dependabot PR). It moves to 7 by hand once Next.js supports it.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
