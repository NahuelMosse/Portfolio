<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion done right</title>
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --fast: 140ms; --press: 120ms; --enter: 320ms; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; }
  main { padding: 32px; display: grid; gap: 24px; max-width: 720px; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px;
    transition: background-color var(--fast) var(--ease-out), box-shadow var(--fast) var(--ease-out), transform var(--press) var(--ease-out); }
  button:hover { background: #e4e4e4; box-shadow: 0 2px 6px rgb(0 0 0 / 0.12); }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }

  a { color: #2a5bd7; text-decoration: underline; text-decoration-color: transparent;
    transition: text-decoration-color var(--fast) var(--ease-out), color var(--fast) var(--ease-out), opacity var(--press) var(--ease-out); }
  a:hover { text-decoration-color: currentColor; }
  a:active { opacity: 0.7; }

  .card { background: #fff; transition: background-color var(--fast) var(--ease-out), box-shadow var(--fast) var(--ease-out), transform 200ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .card:hover { transform: translateY(-4px); } .card:hover:active { transform: translateY(-4px) scale(0.97); } }

  .spinner { width: 24px; height: 24px; border: 3px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #panel { opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.98); transform-origin: top left; background: #eef;
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), visibility 0s linear 200ms; }
  #panel.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

  .reveal { opacity: 0; transform: translateY(12px); transition: opacity var(--enter) var(--ease-out), transform var(--enter) var(--ease-out); }
  .reveal.shown { opacity: 1; transform: none; }

  section { min-height: 600px; padding-top: 24px; }

  @media (prefers-reduced-motion: reduce) {
    button:active, .card:hover, .card:hover:active, #panel, .reveal { transform: none; }
    .spinner { animation-duration: 2400ms; animation-name: pulse; }
    @keyframes pulse { 50% { opacity: 0.4; } }
  }
</style>
</head>
<body>
<main>
  <h1>Orders</h1>
  <p class="reveal">Every order placed this month.</p>
  <div class="row">
    <button class="save">Save</button>
    <a href="#orders">All orders</a>
    <button class="card">Card</button>
    <div class="spinner" aria-label="Loading"></div>
  </div>
  <div class="row">
    <button class="chip">Open</button>
    <button class="chip">Closed</button>
    <a id="report" href="#report">Report</a>
    <button id="open" aria-expanded="false" aria-controls="panel">Details</button>
  </div>
  <div id="panel"><p>Details of the order.</p></div>
  <div style="height: 900px"></div>
  <section class="reveal"><h2>History</h2><p>Older orders.</p></section>
</main>
<script>
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add('shown')));
  document.querySelectorAll('.reveal').forEach((n) => io.observe(n));
  const open = document.getElementById('open');
  const panel = document.getElementById('panel');
  open.addEventListener('click', () => {
    const now = panel.classList.toggle('open');
    open.setAttribute('aria-expanded', String(now));
  });
</script>
</body>
</html>
